<article
  tabindex="0"
  role="button"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="$event.preventDefault(); onCardClick()"
  class="
    group
    flex
    cursor-pointer
    gap-5
    rounded-2xl
    border
    border-transparent
    p-5
    transition-all
    duration-300
    ease-out
    hover:-translate-y-1
    hover:border-neutral-800
    hover:bg-[#151515]
    focus:outline-none
    focus:ring-2
    focus:ring-accent

    sm:gap-8
    sm:p-6
  "
>
  <div class="hidden shrink-0 items-center md:flex">
    <div class="h-20 w-[120px] overflow-hidden rounded-xl">
      <img
        [src]="project.image"
        [alt]="project.title"
        class="h-full w-full object-cover"
      />
    </div>
  </div>

  <div class="flex flex-col">

    <div class="relative flex items-center gap-2">

      <h3 class="text-xl font-medium text-text">
        {{ project.title }}
      </h3>

      @if (project.repositories?.length === 1) {

        <span
          aria-hidden="true"
          class="text-text-muted transition-colors duration-300 group-hover:text-accent"
        >
          <span
            class="inline-block transition-transform duration-300 group-hover:translate-x-1 group-hover:-translate-y-1"
          >
            ↗
          </span>
        </span>

      }

      @if ((project.repositories?.length ?? 0) > 1) {

        <button
          type="button"
          (click)="$event.stopPropagation(); toggleRepositories()"
          class="text-text-muted transition-colors duration-300 hover:text-accent"
          aria-label="View repositories"
        >
          <span
            class="inline-block transition-transform duration-300"
            [class.rotate-45]="showRepositories"
          >
            ↗
          </span>
        </button>

        @if (showRepositories) {

          <div
            class="
              absolute
              left-0
              top-full
              z-20
              mt-2
              flex
              min-w-32
              flex-col
              gap-2
              rounded-xl
              border
              border-neutral-800
              bg-[#151515]
              p-3
              shadow-lg

              desktop:left-full
              desktop:top-0
              desktop:ml-3
              desktop:mt-0
            "
            (click)="$event.stopPropagation()"
          >

            @for (repo of project.repositories; track repo.name) {

              <a
                [href]="repo.url"
                target="_blank"
                rel="noopener noreferrer"
                class="text-sm text-text-muted transition-colors duration-300 hover:text-accent"
              >
                {{ repo.name }} ↗
              </a>

            }

          </div>

        }

      }

    </div>

    <p
      class="mt-3 max-w-3xl text-base font-normal leading-6 text-text-muted"
    >
      {{ project.description }}
    </p>

    <div class="mt-5 flex flex-wrap gap-3">

      @for (tech of project.technologies; track tech) {

        <app-badge-tech
          [name]="tech"
        />

      }

    </div>

  </div>

</article>
