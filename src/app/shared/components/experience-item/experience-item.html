<div class="relative z-10 text-text font-medium">
  <span class="bg-background pr-4">
    {{ experience.period }}
  </span>
</div>


<div>

  <h3 class="text-text font-medium flex items-center gap-2">
    <span class="text-accent text-lg">•</span>
    {{ experience.role }}
  </h3>


  <p class="mt-5 max-w-3xl">
    {{ experience.description }}
  </p>

  @if (experience.projects?.length) {
    <ul class="mt-5 max-w-3xl space-y-6">
      @for (project of experience.projects; track project.title) {
        <li>
          <h4 class="text-text font-medium">{{ project.title }}</h4>
          <p class="mt-2">{{ project.description }}</p>
        </li>
      }
    </ul>
  }

</div>
